name: CI — build and smoke-test the APK

# Builds the debug APK from this repo + the upstream web bundle,
# installs it on an Android emulator and checks it launches without crashing.
# Upstream pin and patches: see ci/apply-patches.sh and PATCHES.md.
# Debug build only — the release keystore never leaves the builder's machine.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out orchestra-android
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # No setup-android action: android-actions/setup-android@v3 runs
      # `sdkmanager tools`, and the obsolete `tools` package no longer exists
      # (run #1 failed on it). The runner ships an Android SDK, but sdkmanager
      # is NOT on PATH (run #2 failed with `command not found`, exit 127),
      # so locate it under $ANDROID_HOME/cmdline-tools first.
      - name: Install Android platform and build tools
        run: |
          for d in "$ANDROID_HOME"/cmdline-tools/*/bin; do
            [ -x "$d/sdkmanager" ] && export PATH="$d:$PATH" && break
          done
          command -v sdkmanager || { echo "sdkmanager not found under $ANDROID_HOME"; ls "$ANDROID_HOME/cmdline-tools/" || true; exit 1; }
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Bun 1.4.2
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Clone upstream orchestra-app at 39945ca8
        run: |
          git clone https://github.com/NeiP4n/orchestra-app.git ../orchestra-app
          git -C ../orchestra-app checkout 39945ca845a091d06550fc24176efdfeacea2357

      - name: Apply our patches to the bundle
        run: bash ci/apply-patches.sh ../orchestra-app

      - name: Install web dependencies
        run: bun install
        working-directory: ../orchestra-app

      # gradle.properties carries the sandbox-only egress trustStore path;
      # on a runner there is direct internet, so drop those flags.
      - name: Drop the sandbox-only trustStore from gradle.properties
        run: sed -i 's|^org.gradle.jvmargs=.*|org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8|' gradle.properties

      # Web-UI upload does not preserve the executable bit on gradlew.
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # GitHub-hosted Linux runners have no KVM / hardware acceleration, so
      # the x86_64 emulator boots in slow software mode and sometimes never
      # makes it (run #9: "Timeout waiting for emulator to boot"). Use the
      # lighter AOSP image (the app needs no Google APIs), give boot twice
      # the time, and skip boot animation/audio/snapshot to speed it up.
      - name: Smoke-test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 1200
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          # The runner executes every script line with a separate
          # `/usr/bin/sh -c`, so multi-line constructs (for/if) break here
          # (run #6 failed on a bare `for ...; do` line). The whole test
          # lives in ci/smoke-test.sh and runs as one command.
          script: bash ci/smoke-test.sh

      - name: Upload APK and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-and-screenshot
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            screenshot.png
